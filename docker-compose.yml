version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: api_db_test_postgres
    environment:
      POSTGRES_DB:       testdb
      POSTGRES_USER:     testuser
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
